    --

    - **Unified Architecture** — one system, multiple specialized components, instead of a model-picker menu

    --

    - **Smart Router** — automatically selects the best internal model for each task

    --

    - **Reduced Hallucinations** — 45% fewer factual errors than GPT-4o

    --

    - **Enhanced Tool Use** — reliably chains dozens of tool calls

    --

    - **Multimodal Excellence** — native text, image, audio, and video support

    # Safety Approach

    --

    ## Traditional Safety Approach
    - Binary refusal (allow/deny)
    - Overly cautious, often blocks helpful answers
    - Lacks nuance for complex or dual-use queries

    --

    ## GPT-5 Safety-Helpfulness ("Safe Completions")
    - Nuanced, context-aware responses
    - Balances safety with helpfulness
    - Enables more informative answers while respecting policy

    .footnote[Source: https://cdn.openai.com/pdf/be60c07b-6bc2-4f54-bcee-4141e1d6c69a/gpt-5-safe_completions.pdf]

    # GPT-5.6 Core Innovations

    ## Same DNA as GPT-5, evolved knobs

    --

    - **Frontier Intelligence** — "a new class of intelligence for coding and professional work"

    --

    - **Explicit Model Selection** — `gpt-5.6-sol`, `gpt-5.6-terra`, `gpt-5.6-luna` (you choose, instead of a router guessing)

    --

    - **Tunable Reasoning** — `none` → `low` → `medium` → `high` → `xhigh` → `max`

    --

    - **Enhanced Tool Use** — shell, Skills, Connectors

    --

    - **Multimodal** — text, image, audio, video

    ---

    # What Actually Changed Since GPT-5?

    --

    **Model selection**: router guessing main/thinking (and a bad reputation for it, see Act I) → you explicitly pick `sol`/`terra`/`luna`

    --

    **Reasoning control**: coarse tiers → 6-level tunable `reasoning.effort`, incl. `pro` mode on Sol (no separate `-pro` model)

    --

    **Conversation state**: manual `previous_response_id` chaining → durable `conversations.create()` object + server-side compaction

    --

    **New in the API**: Programmatic Tool Calling added to the Responses API

    --

    > This is cumulative refinement, not another leap. The honest question for students: is that a problem?

    # GPT-5.6 Sol — The Current Frontier Model

    --

    OpenAI positions `gpt-5.6-sol` as **"a new class of intelligence for coding and professional work"** — the current frontier model for complex professional tasks, absorbing the dedicated-coding role `gpt-5.3-codex` used to hold.

    --

    - **1,050,000-token** context window; **128,000** max output tokens
    - Default `reasoning.effort` is `medium`; supports `none`, `low`, `medium`, `high`, `xhigh`, `max`
    - Hardest problems: same model, `reasoning: {"mode": "pro"}` — no separate `-pro` model anymore

    # Honest Assessment: GPT-5.6 Today

    ---

    # Fixed Since GPT-5

    --

    - **Router distrust** — gone, because there's no router. You pick the model explicitly.

    --

    - **Coarse reasoning control** — 6 tunable levels instead of a hidden switch

    --

    - **Abrupt deprecations** — GPT-5.6's own deprecation notices (Agent Builder, Evals, `v1/prompts`) shipped with a 6-month notice window, unlike the GPT-4o retirement backlash

    --

    - **Safety approach** — safe-completions matured, same framework, no regression

    ---

    # Still True (or New) Today

    --

    - **Simon Willison**, on the three-tier lineup: *"One of the most confusing aspects of GPT-5.6 is figuring out which model to use at which reasoning effort."*

    --

    - **Sol's weakness: fuzzy judgment** — for open-ended architecture or product-tradeoff questions with several defensible answers, still worth running multiple models in parallel

    --

    - **Luna's weakness: shallow reasoning** — weaker on long-context retention and nuance; don't reach for it on complex multi-step analysis

    --

    - **Terra is the sweet spot for most work** — roughly GPT-5.5-class quality at about half the price

    .footnote[Source: simonw.substack.com/p/the-new-gpt-56-family-luna-terra · coderabbit.ai/blog/gpt-5-6-sol-and-terra-benchmark · vellum.ai/blog/gpt-5-6-benchmarks-explained]

    # Conversations API

    **Before (legacy):** manual `previous_response_id` chaining

    ```python
    r1 = client.responses.create(model="gpt-5.6-sol", input="tell me a joke")
    r2 = client.responses.create(
        model="gpt-5.6-sol",
        previous_response_id=r1.id,
        input="explain why this is funny",
    )
    ```

    **After:** a durable conversation object

    ```python
    convo = client.conversations.create()
    client.responses.create(
        model="gpt-5.6-sol", conversation=convo.id, store=True,
        input="tell me a joke",
    )
    ```

    .footnote[Source: https://developers.openai.com/api/docs/guides/conversation-state]

    # Agents SDK

    ---

    # The 7 Agents SDK Primitives

    --

    - **Agent** — the LLM config: instructions + tools; plans, calls tools, keeps state

    --

    - **Runner** — executes the agent loop; manages streaming, state, result handling

    --

    - **Tools** — function tools (`@function_tool`), hosted tools, and MCP servers

    --

    - **Handoffs** — delegate to specialist agents; you control which agent replies

    --

    - **Guardrails** — input/output validation; pause/block risky ops, add human review

    --

    - **Sessions** — automatic conversation-history management, resumable across turns

    --

    - **Tracing** — built-in run tracking to view, debug, and optimize workflows

    .footnote[Source: [openai-agents-python](https://github.com/openai/openai-agents-python) · [Agents guide](https://developers.openai.com/api/docs/guides/agents)]

    ---

    # Agents SDK — Minimal Example

    ## Define an Agent, run it with streaming

    ```python
    from agents import Agent, Runner

    agent = Agent(
        name="Assistant",
        model="gpt-5.6-sol",
        instructions="Help users with their tasks",
    )

    result = Runner.run_streamed(agent, "Summarize today's standup notes")
    async for event in result.stream_events():
        print(event)
    ```

    .footnote[Source: [openai-agents-python](https://github.com/openai/openai-agents-python)]

    # Agents SDK — Handoffs

    ## Triage agent delegates to a specialist

    ```python
    from agents import Agent, Runner

    refunds = Agent(
        name="Refunds Specialist",
        model="gpt-5.6-sol",
        instructions="Handle refund requests end to end.",
    )

    triage = Agent(
        name="Triage",
        model="gpt-5.6-terra",
        instructions="Route the user. Hand off refund issues to the specialist.",
        handoffs=[refunds],            # explicit delegation
    )

    result = Runner.run_sync(triage, "I want a refund for order #4821")
    print(result.final_output)
    ```

    .footnote[Source: [openai-agents-python](https://github.com/openai/openai-agents-python) · [Agents guide](https://developers.openai.com/api/docs/guides/agents)]

    # GPT-5.6 Prompting Guide Complete Breakdown

    ---

    <div style="text-align: center;">
      <img src="../assets/agentic-workflow-spectrum.png" width="65%">
    </div>

    --

    > Prompting guidance changes almost every model generation. The next few slides lead with **current GPT-5.6 practice** — older patterns are noted only as a small "previously" aside, so you can spot and unlearn outdated mental models instead of carrying them forward.

    .footnote[Source: [GPT-5 Prompting Guide](https://cookbook.openai.com/examples/gpt-5/gpt-5_prompting_guide)]

    ---

    # Current Practice: Verbosity Is a Global Parameter

    --

    **GPT-5.6 today:** control output length with the API-level `text.verbosity` parameter (`low`/`medium`/`high`) — a single global switch, not something you write into the prompt.

    ```python
    response = client.responses.create(
        model="gpt-5.6-sol",
        text={"verbosity": "low"},
        input="Summarize this incident report.",
    )
    ```

    --

    **Why:** set once, applies consistently — it doesn't compete with your actual task instructions for the model's attention inside the prompt.

    --

    .previously[
    > *Previously:* this needed an in-prompt `<output_verbosity_spec>` block spelling out sentence/bullet counts. If that's the mental model you learned, drop it — the guide moved this back to the API layer.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5.2 guide](https://developers.openai.com/cookbook/examples/gpt-5/gpt-5-2_prompting_guide) (historical)]

    ---

    # Current Practice: State the Constraint, Skip the Ceremony

    --

    **GPT-5.6 today:** one plain sentence carries the same weight a whole fenced block used to need — the model follows prompt contracts closely, so ceremony doesn't add safety margin anymore.

    ```text
    Implement only what's requested — no extra features, components, or UX embellishments.
    ```

    --

    **Why it's enough now:** GPT-5.6 treats this as a real constraint to satisfy, not a suggestion to weigh against other instructions.

    --

    .previously[
    > *Previously:* the same guidance needed a dedicated `<scope_discipline>` XML block to fight over-coding. The constraint was always correct — only the packaging is obsolete.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5.2 guide](https://developers.openai.com/cookbook/examples/gpt-5/gpt-5-2_prompting_guide) (historical)]

    ---

    # Current Practice: Trust the Default Grounding

    --

    **GPT-5.6 today:** re-grounding on long inputs and flagging unstated assumptions or ungrounded claims are things the model now does reliably on its own — you generally don't need to instruct it to outline, re-state constraints, or self-check before answering.

    --

    **Reserve explicit instructions for genuinely unusual cases:** adversarial or contradictory source material, or domains where a wrong answer is costly enough that you want the check made visible in the output.

    --

    .previously[
    > *Previously:* this needed explicit step-by-step re-grounding and uncertainty-self-check instructions written into every long-context or high-risk prompt. GPT-5.6 does this by default — verify occasionally, don't over-prompt for it.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5.2 guide](https://developers.openai.com/cookbook/examples/gpt-5/gpt-5-2_prompting_guide) (historical)]

    ---

    # Controlling Agentic Eagerness — Less

    --

    **GPT-5.6 today:** `reasoning.effort` is still the real lever — set it low for fast, narrow, low-latency tasks.

    ```python
    response = client.responses.create(
        model="gpt-5.6-sol",
        reasoning={"effort": "none"},
        input="Find the definition of `parse_config` in src/.",
    )
    ```

    --

    **Stopping conditions still matter — say them once, plainly:**

    ```text
    Search only in src/. Stop once you find the function or after 2 searches.
    ```

    --

    **Benefits:** faster responses, more predictable behavior, lower token usage.

    --

    .previously[
    > *Previously:* this same goal needed a full `<context_gathering>` XML template. GPT-5.6's guide names templates like that as trim-worthy — the plain sentence above does the same job.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5 guide](https://cookbook.openai.com/examples/gpt-5/gpt-5_prompting_guide) (historical)]

    ---

    # Controlling Agentic Eagerness — More

    --

    **GPT-5.6 today:** raise `reasoning.effort` for tasks that need real persistence through to completion.

    ```python
    reasoning={"effort": "high"}  # default is "medium"
    ```

    --

    **The model persists on its own now** — it keeps working through a task and verifies edge cases without being told to, so a reminder block isn't doing any work anymore.

    --

    **Tool-calling updates:** a brief one-liner when starting a new phase or changing plan is enough — not a running narration of every step.

    --

    .previously[
    > *Previously:* this needed an explicit `<persistence>` block plus instructions for thorough step-by-step progress narration. GPT-5.6's guide flags both as things to trim; keep `reasoning.effort` as the real lever.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5 guide](https://cookbook.openai.com/examples/gpt-5/gpt-5_prompting_guide) (historical)]

    # Current Practice: Ask for the Outcome, Not the Self-Review

    --

    **GPT-5.6 today:** state the quality bar once, as an outcome — the model already applies this kind of review internally without being asked to narrate a score.

    ```text
    Make sure components are reusable, errors are handled, and the
    implementation is reasonably performant before finishing.
    ```

    --

    .previously[
    > *Previously:* this needed a `<self-reflection>` block asking the model to score itself 1–10 on each dimension and explain improvements. That scored checklist is exactly the kind of process narration GPT-5.6's guide says to trim.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5 guide — Codebase Design](https://cookbook.openai.com/examples/gpt-5/gpt-5_prompting_guide#matching-codebase-design) (historical)]

    ---

    # Current Practice: Concrete Constraints, Not Absolute Words

    --

    **GPT-5.6 today:** keep the specific, measurable rules — drop the "always"/"never" framing around them.

    ```text
    Typography: 4-5 sizes max. Spacing: multiples of 4.
    Color: 1 neutral base + up to 2 accents.
    Loading state: skeleton placeholders. Prefer Radix/shadcn
    for built-in accessibility.
    ```

    --

    **Why:** GPT-5.6 follows prompt contracts closely enough that hard numbers and named defaults do real work on their own — wrapping them in "Always..."/"Never..." adds friction without adding compliance.

    --

    .previously[
    > *Previously:* the same rules were framed inside a `<ui_ux_best_practices>` block full of "Always" directives. The constraints were correct then and still are — only the absolute-word packaging is what GPT-5.6's guide flags as historical.
    ]

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6) · [GPT-5 guide — Codebase Design](https://cookbook.openai.com/examples/gpt-5/gpt-5_prompting_guide#matching-codebase-design) (historical)]

    # Recommended Prompting Patterns

    --

    **1. Brief Thought Process Summary**
    ```markdown
    "Start your response with 2-3 bullet points summarizing
    your reasoning approach before the full answer"
    ```

    --

    **2. Tool-Calling Preambles** *(historical — GPT-5.6's guide says trim this to a brief one-liner, not a running narration)*
    ```markdown
    "Before each tool use, explain: what you're doing,
    why, and what you expect to find"
    ```

    --

    **3. Disambiguated Tool Instructions**
    ```markdown
    "Search for 'class UserAuth' in authentication files only,
    stop after finding the implementation, not just imports"
    ```

    --

    **4. Planned Execution at Minimal Reasoning**
    ```markdown
    "First, outline your approach in 3 steps.
    Then execute each step completely before moving on."
    ```

    ## Professional Output Formatting

    ### **Semantic Markdown Usage:**
    ```markdown
    Use Markdown **only where semantically correct**:
    - `inline code` for functions, variables

    # GPT-5.6 Prompting Guide: The Philosophy Flips

    ---

    # Current Best Practice: Trim, Don't Scaffold

    --

    GPT-5.6's prompting guide reverses earlier advice: outcome-first, not scaffolding-first.

    --

    **Trim:**
    - XML persistence blocks, repeated style rules that don't change behavior
    - Context-gathering templates, self-graded checklists, process narration
    - Absolute directives ("always" / "never")

    --

    **Keep:**
    - Outcome statements, success criteria, stopping conditions
    - Hard, concrete constraints (specific numbers, specific formats)

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6), Jul 2026]

    ---

    # Why the Shift: Measured Impact

    --

    **Measured impact of trimming:** +10–15% eval scores, −41–66% tokens, −33–67% cost

    --

    **New tools instead of prompt scaffolding:** a global `text.verbosity` parameter, and Programmatic Tool Calling (offload filtering/batching to code, not model judgment)

    --

    > **Why the reversal happened:** GPT-5.6 "follows prompt contracts closely" — conflicting or redundant rules now cause instability (the model burns reasoning tokens reconciling contradictions) rather than adding safety margin the way they did on less-steerable 2025-era models.

    .footnote[Source: [OpenAI GPT-5.6 prompting guide](https://developers.openai.com/api/docs/guides/prompt-guidance-gpt-5p6), Jul 2026]

    # Key Takeaways

    ## Closing the Two-Act Arc

    --

    - **GPT-5 proved the leap**: a unified model, frontier benchmarks across math/coding/multimodal, and safe-completions as the new safety standard — with real rollout scars (router backlash, abrupt GPT-4o retirement)

    --

    - **GPT-5.6 refined it**: the router became explicit model selection (`sol`/`terra`/`luna`), reasoning went from a hidden switch to 6 tunable levels, and durable Conversations replaced manual chaining — cumulative, not revolutionary

    --

    - **What's still hard**: picking the right tier/effort combo, Sol's fuzzy judgment on open-ended tradeoffs, Luna's shallow reasoning on complex tasks

    --

    - **Comprehensive API ecosystem** with built-in tools, Agents SDK, and MCP integration ties both eras together

    ---

    # What NOT to Use (Deprecated as of June 2026)

    --

    - **Agent Builder** (visual workflow tool) — sunset **Nov 30, 2026**
      - Migrate to the **Agents SDK** or ChatGPT Workspace Agents

    --

    - **Evals platform** — **read-only Oct 31, 2026**, full shutdown **Nov 30, 2026**
      - Move to the SDK's tracing → eval loop, or code-based evals

    --

    - **Reusable prompt objects** (`v1/prompts`) — shutdown **Nov 30, 2026**
      - Move prompt content into application code

    --

    > These were announced deprecated **Jun 3, 2026** — don't build new workflows on them.
